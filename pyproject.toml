[project]
name = "event-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "psycopg[binary]>=3.2.0",
    "pypika>=0.48.0",
    "aiokafka>=0.12.0",
    "aiohttp>=3.11.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    "yoyo-migrations>=9.0.0",
    "psycopg-pool>=3.3.0",
    "uuid7>=0.1.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.25.0",
    "testcontainers[postgres]>=4.0.0",
    "httpx>=0.28.1",
]
