name: event-service

services:
  krakend:
    image: devopsfaith/krakend:2.7
    ports:
      - "${KRAKEND_PORT}:8080"
    volumes:
      - ./docker/krakend/krakend.json:/etc/krakend/krakend.json:ro
    env_file:
      - .env_krakend
    depends_on:
      event-service:
        condition: service_started
    networks:
      - backend

  event-service:
    build: .
    env_file:
      - .env_event_service
    ports:
      - "${EVENT_SERVICE_PORT}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - backend

  postgres:
    image: postgres:16
    env_file:
      - .env_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    env_file:
      - .env_redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - "${REDPANDA_KAFKA_ADDR}"
      - --advertise-kafka-addr
      - "${REDPANDA_ADVERTISE_KAFKA_ADDR}"
      - --smp
      - "${REDPANDA_SMP}"
      - --memory
      - "${REDPANDA_MEMORY}"
      - --overprovisioned
      - --default-log-level=${REDPANDA_LOG_LEVEL}
    ports:
      - "${REDPANDA_EXTERNAL_PORT}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  redpanda-console:
    image: redpandadata/console:v2.6.0
    env_file:
      - .env_redpanda_console
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.57
    env_file:
      - .env_jaeger
    ports:
      - "${JAEGER_UI_PORT}:16686"
      - "${JAEGER_OTLP_GRPC_PORT}:4317"
      - "${JAEGER_OTLP_HTTP_PORT}:4318"
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.0
    env_file:
      - .env_prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    env_file:
      - .env_grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.0
    env_file:
      - .env_loki
    ports:
      - "${LOKI_PORT}:3100"
    networks:
      - backend

  promtail:
    image: grafana/promtail:2.9.0
    env_file:
      - .env_promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/promtail.yml:/etc/promtail/config.yml
    networks:
      - backend
    depends_on:
      - loki
      - event-service

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
